<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>NoteFlow</title>

    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <div class="app">
      <!-- ================= HEADER ================= -->
      <header class="header">
        <div class="logo">
          <h1>NoteFlow</h1>
          <p>Your thoughts, organized.</p>
        </div>

        <div class="header-actions">
          <div class="search-container">
            <input
              type="search"
              id="search-input"
              placeholder="Search your notes..."
              autocomplete="off"
            />
          </div>

          <!-- Theme toggle button -->
          <button
            id="theme-toggle"
            class="theme-toggle"
            type="button"
            aria-label="Toggle theme"
          >
            🌙
          </button>
        </div>
      </header>

      <!-- ================= MAIN ================= -->
      <main class="main-content">
        <!-- ================= NOTE EDITOR ================= -->
        <section class="note-editor">
          <h2>Write a note</h2>

          <textarea
            id="note-input"
            placeholder="Write your thoughts here..."
          ></textarea>

          <div class="editor-footer">
            <span id="character-count"> 0 characters </span>

            <button id="save-note-btn" type="button">Save Note</button>
          </div>
        </section>

        <!-- ================= NOTES CONTROLS ================= -->
        <section class="notes-controls">
          <div>
            <h2>Your Notes</h2>
            <p id="notes-count">0 notes</p>
          </div>

          <div class="sort-container">
            <label for="sort-select"> Sort by: </label>

            <select id="sort-select">
              <option value="created-newest">Created: Newest</option>

              <option value="created-oldest">Created: Oldest</option>

              <option value="edited-newest">Edited: Newest</option>

              <option value="edited-oldest">Edited: Oldest</option>
            </select>
          </div>
        </section>

        <!-- ================= NOTES LIST ================= -->
        <section class="notes-list" id="notes-list">
          <!--
            JavaScript will create note cards here.

            Example structure that JS could eventually generate:

            <article class="note-card">

              <div class="note-content">
                <p>My note...</p>
              </div>

              <div class="note-meta">
                <span>Created: Aug 15, 2026</span>
                <span>Edited: Aug 15, 2026</span>
              </div>

              <div class="note-actions">
                <button class="edit-btn">Edit</button>
                <button class="delete-btn">Delete</button>
              </div>

            </article>
          -->

          <div class="empty-state" id="empty-state">
            <h3>No notes yet</h3>
            <p>Your saved notes will appear here.</p>
          </div>
        </section>

        <!-- ================= DAILY QUOTE ================= -->
        <section class="daily-quote">
          <div class="quote-header">
            <span>Daily Quote</span>
          </div>

          <blockquote id="quote-text">
            "Your quote will appear here."
          </blockquote>

          <p id="quote-author">— Unknown</p>
        </section>
      </main>

      <!-- ================= FOOTER ================= -->
      <footer class="footer">
        <p>NoteFlow &copy; 2026</p>
      </footer>
    </div>

    <script src="script.js"></script>
  </body>
</html>
